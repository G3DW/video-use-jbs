<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <title>Lower Third (safe-zone)</title>
    <link rel="stylesheet" href="safe-zone.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1080px;
            height: 1920px;
            background: transparent;
            font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        /* Bar pins to the bottom edge of the safe zone so it clears
           TikTok's and Reels' bottom UI at once. */
        .safe-zone {
            display: flex;
            align-items: flex-end;
        }

        .bar {
            width: 100%;
            padding: 28px 32px;
            border-radius: 12px;
            background: rgba(10, 10, 10, 0.72);
            border-left: 8px solid {{ACCENT_COLOR}};
            opacity: 0;
            transform: translateY(24px);
            animation: slide-in 0.45s ease-out 0.15s forwards;
        }

        @keyframes slide-in {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .title {
            font-size: 56px;
            font-weight: 800;
            color: #FFFFFF;
            line-height: 1.15;
        }

        .subtitle {
            margin-top: 8px;
            font-size: 32px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.75);
        }
    </style>
</head>
<body>
    <div class="safe-zone">
        <div class="bar">
            <div class="title">{{TITLE}}</div>
            <div class="subtitle">{{SUBTITLE}}</div>
        </div>
    </div>
</body>
</html>
