<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <title>Animated Captions (safe-zone)</title>
    <style>/*
 * Cross-platform safe zone (TikTok ∩ Reels/Facebook) for 9:16 shorts.
 * Values are injected at render time from ../safe_zones.json — do not
 * hardcode different numbers here; keep safe_zones.json as the single
 * source of truth and let the {{SAFE_*}} placeholders below get replaced.
 */
:root {
  --safe-top: 220px;
  --safe-bottom: 420px;
  --safe-left: 60px;
  --safe-right: 120px;
}

/* Absolute-positioned box that excludes the unsafe margin on all four
 * edges. Place overlay content (captions, lower-thirds, badges) inside
 * this, not directly on the stage/body. */
.safe-zone {
  position: absolute;
  left: var(--safe-left);
  top: var(--safe-top);
  right: var(--safe-right);
  bottom: var(--safe-bottom);
  box-sizing: border-box;
}
</style>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1080px;
            height: 1920px;
            background: transparent;
            font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        /* Captions pin to the bottom edge of the safe zone (as low as
           the platform-chrome margins allow) rather than dead-center,
           which is where the old template placed them. */
        .safe-zone {
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        .caption-container {
            width: 100%;
            text-align: center;
            padding-bottom: 24px;
        }

        .word {
            display: inline-block;
            font-size: 72px;
            font-weight: 800;
            color: #FFFFFF;
            text-shadow:
                2px 2px 4px rgba(0, 0, 0, 0.9),
                0 0 20px rgba(0, 0, 0, 0.5);
            margin: 0 8px 16px 8px;
            opacity: 0;
            transform: scale(0.8);
            transform-origin: center;
            line-height: 1.2;
            position: relative;
            transition: opacity 0.1s ease-out;
        }

        .word.active {
            opacity: 1 !important;
            transform: scale(1);
        }

        .word.active .highlight {
            opacity: 1;
            transform: scaleX(1);
        }

        .word.past {
            opacity: 0.5;
        }

        .highlight {
            position: absolute;
            bottom: 8px;
            left: -4px;
            right: -4px;
            height: 24px;
            background: #FFEB3B;
            z-index: -1;
            opacity: 0;
            transform: scaleX(0);
            transform-origin: left;
            border-radius: 4px;
        }

        /* Punctuation stays with word */
        .punctuation {
            margin-left: -4px;
        }
    </style>
</head>
<body>

        <div class="caption-container" id="captionContainer"></div>
    </div>

        const DURATION = 27.103999999999985;
        const FPS = 30;

        const container = document.getElementById('captionContainer');
        let animationFrameId = null;
        let startTime = null;

        // Create DOM elements for all words
        function initializeWords() {
            container.innerHTML = '';

            WORDS.forEach((wordData, index) => {
                const wordSpan = document.createElement('span');
                wordSpan.className = 'word';
                wordSpan.setAttribute('data-index', index);
                wordSpan.innerHTML = `
                    <span class="highlight"></span>
                    ${wordData.text}
                `;
                container.appendChild(wordSpan);
            });
        }

        // Animate words based on timestamp
        function animate(timestamp) {
            if (!startTime) startTime = timestamp;
            const elapsed = (timestamp - startTime) / 1000; // Convert to seconds

            // Update word states
            WORDS.forEach((wordData, index) => {
                const wordElement = container.querySelector(`[data-index="${index}"]`);
                if (!wordElement) return;

                const wordStart = wordData.start;
                const wordEnd = wordData.end;

                if (elapsed >= wordStart && elapsed < wordEnd) {
                    // Current word - highlight
                    wordElement.classList.add('active');
                    wordElement.classList.remove('past');
                } else if (elapsed >= wordEnd) {
                    // Past word - dim
                    wordElement.classList.remove('active');
                    wordElement.classList.add('past');
                } else {
                    // Future word - hidden
                    wordElement.classList.remove('active', 'past');
                }
            });

            // Continue animation
            if (elapsed < DURATION) {
                animationFrameId = requestAnimationFrame(animate);
            } else {
                // Animation complete - all words visible and dimmed
                container.querySelectorAll('.word').forEach(el => {
                    el.classList.add('past');
                    el.classList.remove('active');
                });
            }
        }

        // Initialize and start
        initializeWords();

        // Start animation immediately for HyperFrames capture
        requestAnimationFrame(animate);
    </script>
