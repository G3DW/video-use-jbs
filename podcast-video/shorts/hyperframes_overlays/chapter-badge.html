<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <title>Chapter Badge (safe-zone)</title>
    <link rel="stylesheet" href="safe-zone.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1080px;
            height: 1920px;
            background: transparent;
            font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        /* Badge pins to the top-left corner of the safe zone, which is
           already clear of TikTok's/Reels' top UI. */
        .safe-zone {
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 14px 24px;
            border-radius: 999px;
            background: rgba(10, 10, 10, 0.72);
            border: 2px solid {{ACCENT_COLOR}};
            opacity: 0;
            animation: fade-in 0.35s ease-out 0.1s forwards;
        }

        @keyframes fade-in {
            to {
                opacity: 1;
            }
        }

        .dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: {{ACCENT_COLOR}};
        }

        .label {
            font-size: 30px;
            font-weight: 700;
            color: #FFFFFF;
            letter-spacing: 0.02em;
        }
    </style>
</head>
<body>
    <div class="safe-zone">
        <div class="badge">
            <span class="dot"></span>
            <span class="label">Chapter {{CHAPTER_NUM}} / {{CHAPTER_TOTAL}}</span>
        </div>
    </div>
</body>
</html>
