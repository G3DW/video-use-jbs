<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Outro CTA Card (safe-zone)</title>
    <link rel="stylesheet" href="safe-zone.css">
    <link rel="stylesheet" href="brand.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--brand-bg);
            font-family: var(--brand-font);
        }

        #stage {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* Background image is copied in as bg-image.png at render time
           (see render_shorts.py) — same still used for the rest of the
           short, so the outro reads as a continuation, not a cut. */
        .bg {
            position: absolute;
            inset: 0;
            background-image: url("bg-image.png");
            background-size: cover;
            background-position: center;
        }

        /* Translucent panel, matching the horizontal video's outro card
           (generate_broll.py card-07: rgba(27,42,59,0.92)). */
        .panel {
            position: absolute;
            inset: 0;
            background: rgba(27, 42, 59, 0.92);
            opacity: 0;
        }

        .safe-zone {
            position: absolute;
            left: var(--safe-left);
            top: var(--safe-top);
            right: var(--safe-right);
            bottom: var(--safe-bottom);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .center {
            text-align: center;
        }

        .wordmark {
            font-family: var(--brand-display-font);
            font-size: 64px;
            font-weight: 800;
            color: var(--brand-text);
            line-height: 1.2;
            margin-bottom: 40px;
            opacity: 0;
        }

        .tagline {
            font-family: var(--brand-mono-font);
            font-size: 32px;
            letter-spacing: 4px;
            color: var(--brand-accent-1);
            text-transform: uppercase;
            font-weight: 700;
            opacity: 0;
        }

        .handle {
            margin-top: 28px;
            font-size: 36px;
            font-weight: 700;
            color: var(--brand-text-light);
            opacity: 0;
        }
    </style>
</head>
<body>
    <div
        id="stage"
        data-composition-id="shorts-outro-card"
        data-start="0"
        data-duration="{{DURATION}}"
        data-fps="30"
        data-width="1080"
        data-height="1920"
    >
        <div class="bg"></div>
        <div class="panel" id="panel"></div>
        <div class="safe-zone">
            <div class="center">
                <div class="wordmark" id="wordmark">{{WORDMARK}}</div>
                <div class="tagline" id="tagline">{{TAGLINE}}</div>
                <div class="handle" id="handle">{{HANDLE}}</div>
            </div>
        </div>
    </div>

    <script src="vendor/gsap.min.js"></script>
    <script>
        const tl = gsap.timeline({ paused: true });

        tl.to('#panel', { opacity: 1, duration: 0.35, ease: 'power2.out' }, 0.05);
        tl.to('#wordmark', { opacity: 1, duration: 0.35, ease: 'power2.out' }, 0.25);
        tl.to('#tagline', { opacity: 1, duration: 0.3, ease: 'power2.out' }, 0.55);
        tl.to('#handle', { opacity: 1, duration: 0.3, ease: 'power2.out' }, 0.75);

        window.__timelines = window.__timelines || {};
        window.__timelines['shorts-outro-card'] = tl;
    </script>
</body>
</html>
